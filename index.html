<script>
const {

/* ==========================================================

const T = {

const shuffle = a => {
  const b = a.slice();
  for (let i = b.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));

};
const range = n => Array.from({
  length: n
}, (_, i) => i);

const perms = arr => {

const lineClue = arr => {

const eqArr = (a, b) => a.length === b.length && a.every((v, i) => v === b[i]);

/* ---------- 取り消し付き状態 ---------- */
function useUndo(init) {

  const set = v => {

    if (past.current.length) {

/* ================= 生成: お絵かきロジック ================= */
function rowPatterns(clue, n) {
  if (clue.length === 0) return [Array(n).fill(0)];
  const res = [];
  const rec = (idx, pos, cur) => {
    if (idx === clue.length) {
      res.push(cur.concat(Array(n - pos).fill(0)));
      return;
    }
    let need = 0;
    for (let k = idx; k < clue.length; k++) need += clue[k];
    need += clue.length - idx - 1;
    for (let s = pos; s <= n - need; s++) {

  const blocks = [];
  let run = 0;
  for (const c of cells) {

      run = 0;
    }
  }
  const open = run;
  for (let i = 0; i < blocks.length; i++) if (blocks[i] !== clue[i]) return false;

    idx++;

function countNonogram(rowClues, colClues, n, cap = 2, nodeCap = 300000) {
  const pats = rowClues.map(c => rowPatterns(c, n));

    nodes = 0,
    aborted = false;
  const grid = [];
  const rec = r => {
    if (aborted || count >= cap) return;
    if (r === n) {
      count++;
      return;
    }
    for (const p of pats[r]) {
      if (++nodes > nodeCap) {
        aborted = true;
        return;
      }
      grid[r] = p;
      let ok = true;
      for (let c = 0; c < n && ok; c++) {

        for (let i = 0; i <= r; i++) cells.push(grid[i][c]);

function genNonogram(n) {
  let last = null;
  for (let t = 0; t < 500; t++) {

    const g = range(n).map(() => range(n).map(() => Math.random() < p ? 1 : 0));
    const ones = g.flat().reduce((a, b) => a + b, 0);
    if (ones < n * n * 0.35 || ones > n * n * 0.7) continue;
    const rc = g.map(lineClue);
    const cc = range(n).map(c => lineClue(g.map(r => r[c])));

/* ================= 生成: ナンプレ6×6 ================= */
const boxOf = (r, c) => Math.floor(r / 2) * 2 + Math.floor(c / 3);

  const used = new Set();
  for (let i = 0; i < 6; i++) {
    used.add(g[r][i]);
    used.add(g[i][c]);
  }
  for (let i = 0; i < 6; i++) for (let j = 0; j < 6; j++) if (boxOf(i, j) === boxOf(r, c)) used.add(g[i][j]);

  for (let r = 0; r < 6; r++) for (let c = 0; c < 6; c++) if (g[r][c] === 0) {

      g[r][c] = v;
      if (fillGrid(g)) return true;
      g[r][c] = 0;

  let count = 0;
  const rec = () => {
    if (count >= cap) return;
    let br = -1,
      bc = -1,
      best = 99,
      bestC = null;
    for (let r = 0; r < 6; r++) for (let c = 0; c < 6; c++) if (g[r][c] === 0) {
      const cd = cands(g, r, c);
      if (cd.length < best) {
        best = cd.length;
        br = r;
        bc = c;
        bestC = cd;
      }

      count++;
      return;
    }
    if (best === 0) return;

  const sol = range(6).map(() => Array(6).fill(0));

  for (const idx of shuffle(range(36))) {
    if (filled <= givens) break;
    const r = Math.floor(idx / 6),

/* ================= 生成: ライツアウト ================= */
const flip = (b, r, c, n) => {
  [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dr, dc]) => {
    const y = r + dr,
      x = c + dc;
    if (y >= 0 && y < n && x >= 0 && x < n) b[y][x] ^= 1;

function minMoves(board, n) {
  let best = Infinity;
  for (let mask = 0; mask < 1 << n; mask++) {
    const b = board.map(r => r.slice());
    let cnt = 0;
    for (let c = 0; c < n; c++) if (mask & 1 << c) {
      flip(b, 0, c, n);
      cnt++;

    for (let r = 1; r < n; r++) for (let c = 0; c < n; c++) if (b[r - 1][c] === 1) {

  for (let t = 0; t < 200; t++) {

/* ================= 生成: 席替え推理 ================= */
function genLogic(names, items, strict) {
  const n = names.length;

  for (const it of items) for (let s = 1; s <= n; s++) {
    push(`${s}番の席の人は${it}を飲まない`, a => seatOf(a, ownerOf(a, it)) !== s);

function solveCrypt(words, cap = 2) {
